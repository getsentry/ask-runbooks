- query: Clickhouse cluster running out of disk space
  expected_incidents:
    - INC-58
  expected_runbooks:
    - Adding Disk To A Clickhouse Instance
    - "Resizing Disks"

- query: taskbroker pods are crashlooping
  expected_incidents:
    - INC-1483
  expected_runbooks:
    - Pausing the Workers
    - Identify Workers/Queue for a given task

- query: postgres queries slow and timing out
  expected_incidents:
    - INC-1261
    - INC-1413
  expected_runbooks:
    - Long Running Postgres Queries
    - Long running transactions and subtrans locks
    - PGBouncer
    - Postgres Routine Reindexing

- query: save_event backlogged due to one project
  expected_incidents:
    - INC-60
  expected_runbooks:
    - Dropping events per project/event-type/organization (killswitches)
    - Identify Workers/Queue for a given task
    - Increasing Org Rate/Abuse Limits

