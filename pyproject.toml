[project]
name = "ask-runbooks"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.86.0",
    "psycopg2-binary>=2.9.11",
    "pgvector>=0.4.2",
    "sentence-transformers>=5.3.0",
    "einops>=0.8.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
ask-runbooks = "ask_runbooks.ask:main"
ask-runbooks-web = "ask_runbooks.web:main"
sync-runbooks = "ask_runbooks.sync:main"

[project.optional-dependencies]
dev = [
    "pyright>=1.1",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_runbooks"]
